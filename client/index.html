<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260908" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한림대학교 디지털인문예술전공</title>
  <meta name="description" content="한림대학교 디지털인문예술전공은 AI, 디자인, 인문사회학을 융합해 디지털 시대의 새로운 가치를 만드는 교육과정입니다." />
  <meta name="google-site-verification" content="VIO0lYGOjpkD3YDkBO2hWUwztQ21_9zK3DMgqM7OJwo" />

  <!-- 37_OG: 공유 미리보기(카카오톡·트위터·슬랙). 크롤러는 JS를 실행하지 않으므로
         이 정적 태그가 전 라우트의 미리보기를 담당한다(vercel.json이 모든 경로를 index.html로 리라이트).
         %SITE_URL%은 vite.config.js가 VITE_SITE_URL 환경변수로 치환한다 — 도메인 하드코딩 금지.
         og:image는 반드시 https 절대 URL이어야 카카오가 읽는다(상대경로는 무시됨). -->
  <link rel="canonical" href="%SITE_URL%/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="한림대학교 디지털인문예술전공" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="%SITE_URL%/" />
  <meta property="og:title" content="한림대학교 디지털인문예술전공" />
  <meta property="og:description" content="한림대학교 디지털인문예술전공은 AI, 디자인, 인문사회학을 융합해 디지털 시대의 새로운 가치를 만드는 교육과정입니다." />
  <meta property="og:image" content="%SITE_URL%/videos/hero-poster.jpg" />
  <meta property="og:image:secure_url" content="%SITE_URL%/videos/hero-poster.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="1080" />
  <meta property="og:image:alt" content="한림대학교 디지털인문예술전공" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="한림대학교 디지털인문예술전공" />
  <meta name="twitter:description" content="한림대학교 디지털인문예술전공은 AI, 디자인, 인문사회학을 융합해 디지털 시대의 새로운 가치를 만드는 교육과정입니다." />
  <meta name="twitter:image" content="%SITE_URL%/videos/hero-poster.jpg" />

  <!-- 검색 크롤러가 JavaScript 실행 전에도 공식 학교·전공 명칭을 바로 판독하도록 한다.
       화면 브랜드는 "디지털인문예술전공"으로 유지하되, 한림대학교/한림대 검색어와의
       공식 관계는 구조화 데이터로 명확히 제공한다. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "한림대학교 디지털인문예술전공",
      "alternateName": ["한림대 디지털인문예술전공", "Digital Arts and Humanities, Hallym University", "DAH"],
      "url": "%SITE_URL%/",
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "한림대학교"
      }
    }
  </script>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 히어로 첫 화면: 88KB poster를 먼저 높은 우선순위로 받아 빈 화면을 없앤다.
         아래 hero.mp4 preload가 대역폭을 먼저 점유하지 않도록 poster를 앞에 둔다. -->
  <link rel="preload" as="image" href="/videos/hero-poster.jpg" fetchpriority="high" />
  <link rel="preload" as="video" href="/videos/hero.mp4" />
  <!-- F1: Pretendard 단일 폰트 (Space Grotesk·IBM Plex Mono·Anton 로드 제거) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
