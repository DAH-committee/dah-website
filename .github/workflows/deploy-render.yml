name: Deploy server to Render

# 2026-09-20 정리: 운영 서버(Render 학교 워크스페이스 dah-website, dah-website-72a4.onrender.com)의
# 소스를 DAH-committee/dah-website 로 바꿨다. Render GitHub 자격증명이 학교 계정이라 webhook이
# 정상 생성되고, main push는 Render가 직접 자동 배포한다(Auto-Deploy: On Commit).
#
# 이 워크플로는 백업 경로다. Render webhook이 깨졌을 때 Deploy Hook URL로 POST해 배포를 트리거한다.
# 과거에는 조건이 hyunho2378/dah-website 로 고정돼 있어서 학교 저장소에 push해도 항상 skip 되었고,
# 그 때문에 운영 서버가 7일간 옛 코드에 머물렀다 — 같은 사고를 막기 위해 두 저장소를 모두 허용한다.
#
# 시크릿(RENDER_DEPLOY_HOOK)이 없으면 실패시키지 않고 조용히 건너뛴다 —
# 포크·PR 환경에서는 시크릿이 주입되지 않아 매번 빨간 X가 뜨는 것을 막기 위함.

on:
  push:
    branches: [main]
  # 수동 실행(Actions 탭 > Run workflow)으로도 배포를 걸 수 있게 둔다
  workflow_dispatch:

jobs:
  deploy:
    # 포크에서는 돌리지 않는다(시크릿도 없고 원본 서비스를 건드릴 이유도 없다)
    if: github.repository == 'DAH-committee/dah-website' || github.repository == 'hyunho2378/dah-website'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK 시크릿이 없습니다 — 배포 트리거를 건너뜁니다."
            echo "등록: GitHub 레포 > Settings > Secrets and variables > Actions >"
            echo "  New repository secret > Name=RENDER_DEPLOY_HOOK, Value=<Render Deploy Hook URL>"
            exit 0
          fi
          echo "Render 배포를 트리거합니다."
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"
          echo ""
          echo "트리거 완료. 진행 상황은 Render 대시보드 > 서비스 > Events에서 확인하세요."
