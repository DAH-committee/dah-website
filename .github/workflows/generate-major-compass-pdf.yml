name: Update major compass PDF

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/public/images/**'
      - 'client/public/videos/hero-poster.jpg'
      - 'client/scripts/generate-major-compass-pdf.mjs'
      - 'client/.env.pdf'
      - 'client/package.json'
      - 'client/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: major-compass-pdf-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build website and generate PDF
        working-directory: client
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run pdf

      - name: Commit refreshed PDF
        run: |
          if git diff --quiet -- client/public/downloads/2026-major-compass.pdf; then
            echo "PDF 내용이 동일합니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/downloads/2026-major-compass.pdf
          git commit -m "docs: refresh major compass PDF [skip ci]"
          git push
