name: Update presentation PDFs

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/public/images/**'
      - 'client/public/videos/**'
      - 'client/scripts/generate-presentation-pdfs.mjs'
      - 'client/scripts/presentation-pdfs.config.mjs'
      - 'client/.env.pdf'
      - 'client/package.json'
      - 'client/package-lock.json'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presentation-pdfs-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build website and generate every registered PDF
        working-directory: client
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run pdf

      - name: Commit refreshed PDFs
        run: |
          if git diff --quiet -- 'client/public/downloads/*.pdf'; then
            echo "PDF 내용이 동일합니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'client/public/downloads/*.pdf'
          git commit -m "docs: refresh presentation PDFs [skip ci]"
          git push
