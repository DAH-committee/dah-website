name: Update presentation PDFs

# 자동 실행(푸시마다, 6시간마다)은 끔. 푸시가 겹쳐 막히고 서버와 DB를 자주 깨워서 필요할 때 Actions에서 직접 실행한다
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presentation-pdfs-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build website and generate every registered PDF
        working-directory: client
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run pdf

      - name: Commit refreshed PDFs
        run: |
          if git diff --quiet -- 'client/public/downloads/*.pdf'; then
            echo "PDF 내용이 동일합니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'client/public/downloads/*.pdf'
          git commit -m "docs: refresh presentation PDFs [skip ci]"
          git push
